<footer class="footer">
  <p class="copyright">&copy; {{ year }} Firecloak</p>

  <div class="social-links">
    @for (link of socialLinks; track link.url) {
      <a [href]="link.url" target="_blank" rel="noopener" [attr.aria-label]="'Firecloak on ' + link.name">
        <fa-icon [icon]="link.icon" aria-hidden="true" />
      </a>
    }
  </div>
</footer>
