<mat-toolbar class="header">
  <mat-toolbar-row class="brand-row">
    <a routerLink="/" class="brand">Firecloak</a>
  </mat-toolbar-row>

  <mat-toolbar-row class="nav-row" [class.handset]="isHandset()">
    @if (isHandset()) {
      <button mat-icon-button (click)="menuToggle.emit()" aria-label="Toggle navigation menu">
        <mat-icon>menu</mat-icon>
      </button>
    } @else {
      <nav class="desktop-nav">
        @for (link of menuLinks; track link.url) {
          <a
            mat-button
            [routerLink]="link.url"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.url === '/' }"
          >
            {{ link.title }}
          </a>
        }
      </nav>
    }
  </mat-toolbar-row>
</mat-toolbar>
