<mat-toolbar class="header">
  <mat-toolbar-row class="brand-row">
    <a routerLink="/" class="brand">
      <img
        ngSrc="layout/firecloak-logo.png"
        width="250"
        height="101"
        alt="Firecloak logo"
        priority
      />
    </a>
  </mat-toolbar-row>

  <mat-toolbar-row class="nav-row" [class.handset]="isHandset()">
    @if (isHandset()) {
      <button mat-icon-button (click)="menuToggle.emit()" aria-label="Toggle navigation menu">
        <mat-icon>menu</mat-icon>
      </button>
    } @else {
      <nav class="desktop-nav">
        @for (link of menuLinks; track link.url) {
          <a
            mat-button
            [routerLink]="link.url"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.url === '/' }"
          >
            {{ link.title }}
          </a>
        }
      </nav>
    }

    <div class="theme-toggle">
      <mat-icon aria-hidden="true">light_mode</mat-icon>
      <mat-slide-toggle
        [checked]="theme.isDark()"
        (change)="theme.toggle()"
        aria-label="Toggle dark mode"
      />
      <mat-icon aria-hidden="true">dark_mode</mat-icon>
    </div>
  </mat-toolbar-row>
</mat-toolbar>
