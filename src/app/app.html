<mat-sidenav-container class="app-shell">
  <mat-sidenav #drawer mode="over" (click)="drawer.close()">
    <mat-nav-list>
      @for (link of navLinks; track link.url) {
        <a
          mat-list-item
          [routerLink]="link.url"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.url === '/' }"
        >
          {{ link.title }}
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-header (menuToggle)="drawer.toggle()" />
    <main>
      <router-outlet />
    </main>
    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
